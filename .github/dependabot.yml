# Dependabot: one grouped PR per ecosystem and directory, weekly. Limit 1 keeps
# a single open version PR that Dependabot updates in place until it is merged.
# Security advisories still open separately, by GitHub design.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    labels: ["dependencies", "npm"]
    groups:
      all-npm:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/api"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    labels: ["dependencies", "npm", "api"]
    groups:
      all-api:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    labels: ["dependencies", "github-actions"]
    groups:
      all-actions:
        patterns: ["*"]
